<!doctype html><html><head><meta charset="utf-8"><title>Presenter View Follow</title>
<style>
  body { font: 13px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; width: 340px; margin: 0; padding: 14px 16px 16px; color: #1c1c1c; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 10px; letter-spacing: .02em; }
  label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #666; margin: 10px 0 4px; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #c8c8c8; border-radius: 6px; font: 13px ui-monospace, Menlo, Consolas, monospace; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; }
  button { margin-top: 12px; padding: 8px 14px; border: 0; border-radius: 6px; background: #3b82f6; color: #fff; font-weight: 600; cursor: pointer; }
  #status { margin-top: 12px; padding: 9px 10px; border-radius: 6px; background: #f2f2f2; font: 12px ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  #status.ok { background: #e6f7ee; } #status.bad { background: #fde8e6; }
  p.hint { color: #666; font-size: 11px; margin: 10px 0 0; }
</style></head><body>
<h1>Presenter View Follow</h1>
<label for="bridge">Bridge web-app URL</label><input id="bridge" type="text" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false">
<label for="token">Bridge token</label><input id="token" type="password" spellcheck="false">
<div class="row"><input id="followEditor" type="checkbox"><label for="followEditor" style="margin:0;text-transform:none;letter-spacing:0;font-weight:500;color:#1c1c1c">Also follow the editor (edit view), not just Present</label></div>
<button id="save">Save</button>
<div id="status">No slide reported yet. Start presenting in this browser.</div>
<p class="hint">Same URL and token as the presenter view. Only the slide ID is sent — nothing from the deck.</p>
<script src="popup.js"></script></body></html>
